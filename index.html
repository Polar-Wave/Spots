<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spots - Native music player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="resources/spotify.png" alt="spots">Spots</li>
            <li>Home</li>
            <li>About
        </ul>
    </nav>
    <div class="container">
        <div class="songList">
            <h1 style="font-weight: 450; font-size: 4lvh;">Refrain</h1>
            <div>
                <div class="songItem">
                    <i id="1" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/1p.jpg" alt="1">
                    <span class="songName">Fly me to the moon</span>
                    <span class="songlistPlay"><span class="timeStamp">01:06</span>
                </div>
                <div class="songItem">
                    <i id="2" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/2p.png" alt="1">
                    <span class="songName">The girl in the drawing</span>
                    <span class="songlistPlay"><span class="timeStamp">04:47</span>
                </div>
                <div class="songItem">
                    <i id="3" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/34p.jpg" alt="1">
                    <span class="songName">Intro to the snow</span>
                    <span class="songlistPlay"><span class="timeStamp">01:41</span>
                </div>
                <div class="songItem">
                    <i id="4" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/34p.jpg" alt="1">
                    <span class="songName">Stranded Lullaby</span>
                    <span class="songlistPlay"><span class="timeStamp">03:40</span>
                </div>
                <div class="songItem">
                    <i id="5" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/56p.png" alt="1">
                    <span class="songName">1.11   Ciel black</span>
                    <span class="songlistPlay"><span class="timeStamp">02:18</span>
                </div>
                <div class="songItem">
                    <i id="6" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/56p.png" alt="1">
                    <span class="songName">Si deus me relinquit</span>
                    <span class="songlistPlay"><span class="timeStamp">06:55</span>
                </div>
                <div class="songItem">
                    <i id="7" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/7p.png" alt="1">
                    <span class="songName">このスピードの先へ</span>
                    <span class="songlistPlay"><span class="timeStamp">03:24</span>
                </div>
                <div class="songItem">
                    <i id="8" class="fa-solid songItemPlay fa-2x fa-play-circle"></i>
                    <img src="thumbs/8p.png" alt="1">
                    <span class="songName">Tender affection</span>
                    <span class="songlistPlay"><span class="timeStamp">01:57</span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <!--fontawesome icons -->
            <i class="fa-solid fa-2x fa-step-backward" id="previous"></i>
            <i class="fa-solid fa-3x fa-play-circle" id="masterPlay"></i>
            <i class="fa-solid fa-2x fa-step-forward" id="next"></i>
        </div>
        <div class="songInfo">
            <span  id="masterSongName">Fly me to the moon</span>
        </div>
        <div class="gif">
            <img src="resources/placidplace-frequency-17301_512.gif" width="220px" class="gif">
            <img src="resources/placidplace-frequency-17301_512.gif" width="220px" class="gif"> 
        </div>
    </div>
    <script src="https://kit.fontawesome.com/097233557a.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
